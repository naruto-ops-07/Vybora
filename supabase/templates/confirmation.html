<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your VYBORA code</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #ffffff;
      color: #1a1a1a;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    "
  >
    <div style="max-width: 420px; margin: 0 auto">
      <p style="margin: 0 0 24px; font-size: 14px; font-weight: 700; letter-spacing: 0.2em">
        VYBORA
      </p>
      <p style="margin: 0 0 12px; font-size: 16px; line-height: 1.5">
        Welcome! Enter this code to confirm your email and finish creating your account.
      </p>
      <p
        style="
          margin: 16px 0;
          font-size: 36px;
          font-weight: 700;
          letter-spacing: 0.3em;
          font-family: 'SFMono-Regular', Menlo, Consolas, monospace;
        "
      >
        {{ .Token }}
      </p>
      <p style="margin: 0 0 24px; font-size: 14px; line-height: 1.5; color: #555555">
        This code expires in 10 minutes.
      </p>
      <p style="margin: 0 0 8px; font-size: 14px; line-height: 1.5; color: #555555">
        Or confirm with this link:
      </p>
      <p style="margin: 0 0 24px; font-size: 14px; line-height: 1.5; word-break: break-all">
        <a href="{{ .ConfirmationURL }}" style="color: #1a1a1a">{{ .ConfirmationURL }}</a>
      </p>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #777777">
        If you didn’t ask for this, you can ignore this email.
      </p>
    </div>
  </body>
</html>
