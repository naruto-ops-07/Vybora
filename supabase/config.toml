# Supabase CLI configuration for LOCAL development (`supabase start`).
# Production settings (redirect URLs, SMTP, providers) are configured in the
# Supabase dashboard — see docs/DEPLOYMENT.md.

project_id = "vybora"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/reset-password",
  "http://localhost:4173/auth/callback",
  "vybora://auth/callback",
  "exp://127.0.0.1:8081/--/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local only: skip email confirmation so E2E tests can sign up directly.
# Production MUST enable confirmations in the dashboard.
enable_confirmations = false
max_frequency = "1m0s"
# Email codes: a 6-digit code that expires after 10 minutes.
otp_length = 6
otp_expiry = 600

# Both templates show the code ({{ .Token }}) and keep the link as a fallback.
[auth.email.template.confirmation]
subject = "Your VYBORA code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your VYBORA sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_refresh = 150

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.delete-account]
verify_jwt = true

[functions.cleanup-media]
verify_jwt = true

[functions.send-push]
verify_jwt = true
